services:
  database:
    image: mysql:9.6
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-transaction}"
      MYSQL_USER: "${MYSQL_USER:-app}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no arquivo .env (veja .env.example)}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no arquivo .env (veja .env.example)}"
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - transaction_data:/var/lib/mysql
    healthcheck:
      # "mysqladmin ping" retorna 0 sempre que o servidor responde, inclusive com "Access denied";
      # por isso o healthcheck não precisa de usuário nem senha.
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "--silent" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  transaction_data:
